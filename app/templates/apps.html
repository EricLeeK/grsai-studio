<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grsai Studio Apps</title>
  <link rel="icon" href="{{ static_url('img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app app-switcher">
    <header class="header">
      <a class="header-brand header-brand-link" href="/">
        <div class="brand-mark">G</div>
        <div class="brand-text">
          <h1>Grsai Studio</h1>
          <span class="brand-sub">App Switcher</span>
        </div>
      </a>
      <div class="header-right">
        <a class="header-link header-link-secondary" href="/">Back to Generate</a>
      </div>
    </header>
    <main class="apps-page">
      <section class="apps-grid" aria-label="Studio apps">
        <a class="app-tile app-tile-primary" href="/">
          <span class="app-tile-kicker">Default</span>
          <strong>Image Workbench</strong>
          <span>Prompt, reference, generate, and manage image tasks.</span>
        </a>
        <a class="app-tile" href="/comic">
          <span class="app-tile-kicker">Comic</span>
          <strong>Paper Comic</strong>
          <span>Build paper explainer comics page by page with candidates.</span>
        </a>
        <a class="app-tile" href="/publisher">
          <span class="app-tile-kicker">WeChat</span>
          <strong>Publisher</strong>
          <span>Convert articles, generate covers, and prepare drafts.</span>
        </a>
      </section>
    </main>
  </div>
</body>
</html>
